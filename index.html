<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISTIMERS-MU | Panel</title>
  <style>
    :root {
      --bg: #0b0f19; --card-bg: #151f30; --accent: #38bdf8;
      --text: #f8fafc; --green: #22c55e; --yellow: #eab308; --red: #ef4444;
    }
    body { background-color: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    
    /* Formulario Auth */
    .auth-box { max-width: 360px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    .auth-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    .auth-box button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; }
    
    /* Dashboard Grid */
    h1 { text-align: center; color: var(--accent); }
    .server-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .server-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .server-btn.active { background: var(--accent); color: #0f172a; font-weight: bold; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; text-align: center; border: 2px solid #334155; position: relative; }
    .status-ok { border-color: var(--green); } .status-warning { border-color: var(--yellow); } .status-alert { border-color: var(--red); }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO / REGISTRO -->
  <div id="auth-screen" class="auth-box">
    <h2>⚔️ MISTIMERS-MU</h2>
    <input type="text" id="user" placeholder="Usuario">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">Iniciar Sesión</button>
    <button onclick="register()" style="background:#475569; color:white;">Solicitar Registro</button>
    <p id="msg" style="font-size:0.85rem; color:#f87171; margin-top:12px;"></p>
  </div>

  <!-- DASHBOARD PRINCIPAL (OCULTO POR DEFECTO) -->
  <div id="dashboard-screen" class="hidden">
    <h1>⚔️ MISTIMERS-MU</h1>
    <div class="server-selector">
      <button class="server-btn active" onclick="setServerFilter('ALL')">TODOS</button>
      <button class="server-btn" onclick="setServerFilter('Server 1')">SERVER 1</button>
      <button class="server-btn" onclick="setServerFilter('Server 2')">SERVER 2</button>
      <button class="server-btn" onclick="setServerFilter('Server 3')">SERVER 3</button>
      <button class="server-btn" onclick="setServerFilter('Server 20')">SERVER 20</button>
    </div>
    <div class="grid-container" id="boss-grid"></div>
  </div>

  <script>
    const API_URL = "https://mistimers-api.onrender.com"; // Tu URL real de Render
    let token = localStorage.getItem('token');

    const bossConfigStandard = [
      { id: 'Borgar_1', name: 'Borgar #1', respawnMin: 120 }, { id: 'Borgar_2', name: 'Borgar #2', respawnMin: 120 },
      { id: 'Dreadhorn', name: 'Dreadhorn', respawnMin: 60 }, { id: 'Moltragon', name: 'Moltragon', respawnMin: 60 },
      { id: 'Vescrya', name: 'Vescrya', respawnMin: 420 }, { id: 'Muggron', name: 'Muggron', respawnMin: 180 }, { id: 'Kharzul', name: 'Kharzul', respawnMin: 60 }
    ];
    const bossConfigVIP = [
      { id: 'Vescrya', name: 'Vescrya', respawnMin: 420 }, { id: 'Kharzul', name: 'Kharzul', respawnMin: 60 },
      { id: 'Muggron_CW1', name: 'Muggron (CW) #1', respawnMin: 180 }, { id: 'Muggron_CW2', name: 'Muggron (CW) #2', respawnMin: 180 },
      { id: 'Muggron_BK1', name: 'Muggron (BK) #1', respawnMin: 180 }, { id: 'Muggron_BK2', name: 'Muggron (BK) #2', respawnMin: 180 }
    ];

    let currentFilter = 'ALL', globalState = {};

    async function login() {
      const u = document.getElementById('user').value, p = document.getElementById('pass').value;
      const res = await fetch(`${API_URL}/api/login`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        localStorage.setItem('token', token);
        showDashboard();
      } else {
        document.getElementById('msg').innerText = data.detail;
      }
    }

    async function register() {
      const u = document.getElementById('user').value, p = document.getElementById('pass').value;
      const res = await fetch(`${API_URL}/api/register`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      const data = await res.json();
      document.getElementById('msg').style.color = res.ok ? "#4ade80" : "#f87171";
      document.getElementById('msg').innerText = data.detail || data.message;
    }

    function showDashboard() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      setInterval(fetchState, 3000);
      fetchState();
    }

    async function fetchState() {
      const res = await fetch(`${API_URL}/api/boss/state`);
      if (res.ok) { globalState = await res.json(); renderCards(); }
    }

    function renderCards() {
      const grid = document.getElementById('boss-grid'); grid.innerHTML = '';
      const SERVIDORES = ["Server 1", "Server 2", "Server 3", "Server 20"];
      const srvs = currentFilter === 'ALL' ? SERVIDORES : [currentFilter];

      srvs.forEach(srv => {
        const list = srv === 'Server 20' ? bossConfigVIP : bossConfigStandard;
        list.forEach(boss => {
          const killStr = globalState[srv] ? globalState[srv][boss.id] : null;
          const lastKill = killStr ? new Date(killStr) : null;
          let timerText = "SIN DATOS", statusClass = "";

          if (lastKill) {
            const respawn = new Date(lastKill.getTime() + boss.respawnMin * 60000);
            const diffMs = respawn - new Date();
            if (diffMs <= 0) { timerText = "¡SPAWNED!"; statusClass = "status-alert"; }
            else {
              const m = Math.floor(diffMs / 60000), h = Math.floor(m / 60);
              timerText = h > 0 ? `${h}h ${m%60}m` : `${m%60}m`;
              statusClass = m <= 15 ? "status-warning" : "status-ok";
            }
          }
          grid.innerHTML += `<div class="card ${statusClass}">
            <div style="font-size:0.75rem; color:#64748b; font-weight:bold;">${srv}</div>
            <div style="font-size:1.1rem; font-weight:bold; margin:8px 0;">${boss.name}</div>
            <div style="font-size:1.8rem; font-weight:bold; font-family:monospace;">${timerText}</div>
          </div>`;
        });
      });
    }

    function setServerFilter(srv) {
      currentFilter = srv;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(srv.toUpperCase())));
      renderCards();
    }

    if (token) showDashboard();
  </script>
</body>
</html>
